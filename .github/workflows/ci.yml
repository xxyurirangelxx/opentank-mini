name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verificar versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "from pathlib import Path; print(next(line.split(':', 1)[1].strip().split('+')[0] for line in Path('pubspec.yaml').read_text(encoding='utf-8').splitlines() if line.startswith('version:')))")
          if [[ "$TAG_NAME" != "v$version" ]]; then
            printf 'A tag %s não corresponde à versão v%s do pubspec.yaml\n' "$TAG_NAME" "$version"
            exit 1
          fi
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  build-linux:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev cmake ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-tree-shake-icons
      - name: Empacotar Linux
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: tar -czf "OpenTankMini-${TAG_NAME#v}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-linux
          path: app/OpenTankMini-*-linux-x64.tar.gz
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Preparar APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "OpenTankMini-${TAG_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-android
          path: app/OpenTankMini-*-android.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-tree-shake-icons
      - name: Gerar instalador Windows
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: python tools/build_installer.py --skip-build
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-windows
          path: dist/OpenTankMini-*-windows-x64.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-linux, build-android, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --verify-tag --title "OpenTank Mini ${TAG_NAME#v}" --generate-notes
